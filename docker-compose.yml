services:
  backend:
    build:
      context: ./backend
      args:
        APP_UID: ${APP_UID:-10001}
        APP_GID: ${APP_GID:-10001}
    env_file:
      - path: .env
        required: false
    environment:
      CLAMD_HOST: clamd
      CLAMD_PORT: 3310
      DATABASE_URL: /app/data/sentinel.db
      QUARANTINE_DIR: /app/data/quarantine
    expose:
      - "8000"
    volumes:
      - app-data:/app/data
    depends_on:
      clamd:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/app/lib/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:5173:8080"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/ready"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  # The image initializes signatures and freshclam keeps the persistent database updated.
  clamd:
    image: clamav/clamav:stable
    volumes:
      - clam-db:/var/lib/clamav
      - ./deploy/clamd/clamd.conf:/etc/clamav/clamd.conf:ro,z
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "clamdscan", "--ping=1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 120s

  # Linux-only, opt-in real-time scanning for the requested host folders.
  # Start with: docker compose --profile onaccess up -d
  clamonacc:
    build:
      context: ./deploy/clamd
      dockerfile: Dockerfile.onaccess
    profiles: ["onaccess"]
    depends_on:
      clamd:
        condition: service_healthy
    command: ["--foreground", "--stream", "--wait", "--config-file=/etc/clamav/onaccess.conf"]
    network_mode: "service:clamd"
    pid: host
    cap_add:
      - SYS_ADMIN
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./deploy/clamd/onaccess.conf:/etc/clamav/onaccess.conf:ro,z
      - type: bind
        source: ${ONACCESS_DOWNLOAD_DIR:-~/Download}
        target: /scan/Download
        read_only: true
      - type: bind
        source: /tmp
        target: /scan/tmp
        read_only: true
    restart: unless-stopped

volumes:
  app-data:
  clam-db:
